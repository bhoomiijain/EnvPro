server:
  port: 8080

spring:
  application:
    name: envpro-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/envpro}
    username: ${DATABASE_USERNAME:envpro}
    password: ${DATABASE_PASSWORD:envpro}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

envpro:
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  simulation:
    enabled: true
