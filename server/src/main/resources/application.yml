server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: envpro-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/envpro_db}
    username: ${SPRING_DATASOURCE_USERNAME:envpro_user}
    password: ${SPRING_DATASOURCE_PASSWORD:envpro_secure_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

envpro:
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081}
  simulation:
    enabled: true
