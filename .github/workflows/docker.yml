name: Docker Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Docker Compose — Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f docker-compose.yaml build

      - name: Start stack
        run: docker compose -f docker-compose.yaml up -d

      - name: Wait for frontend
        run: |
          echo "Waiting for EnvPro web on :8081..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8081/ > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend did not become ready"
          docker compose logs
          exit 1

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/actuator/health > /dev/null; then
              echo "Backend health OK"
              exit 0
            fi
            sleep 3
          done
          echo "Backend health check failed"
          docker compose logs backend
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yaml down -v

  publish:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web image
        run: docker build -f Dockerfile -t ghcr.io/${{ github.repository_owner }}/envpro-web:latest .

      - name: Push web image
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/envpro-web:latest ghcr.io/${{ github.repository_owner }}/envpro-web:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/envpro-web:latest
          docker push ghcr.io/${{ github.repository_owner }}/envpro-web:${{ github.sha }}
