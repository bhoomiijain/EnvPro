name: Maven Build

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven — Frontend & Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies (npm ci)
        run: npm ci

      - name: Maven verify
        run: ./mvnw -B -ntp verify -Dskip.npm.deps=true

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: envpro-server-jar
          path: server/target/envpro-server.jar
          retention-days: 7
