name: Maven UI Build

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:        # lets you click "Run workflow" manually in GitHub UI

jobs:
  verify:
    name: 🔨 Maven Build (Frontend + Backend)
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repo code onto the runner
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 25 (matches server/pom.xml requirement)
      - name: ☕ Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven          # caches ~/.m2 between runs → faster builds

      # 3. Run the full build: Node install → npm ci → vite build → Spring Boot compile
      - name: 🏗️ Run Maven verify
        run: mvn -B -ntp verify

      # 4. Upload the built frontend as a downloadable artifact in GitHub UI
      - name: 📦 Upload dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
